<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif;">
  <!-- Page background -->
  <rect width="1200" height="700" fill="#F4F4F5"/>

  <!-- ── Left column (timer + sidebar) 252px wide ── -->

  <!-- Pomodoro Timer card -->
  <rect x="24" y="8" width="220" height="88" rx="12" fill="white" stroke="#E4E4E8" stroke-width="1"/>
  <!-- Phase tabs -->
  <rect x="34" y="18" width="50" height="22" rx="99" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
  <text x="59" y="33" font-size="10" font-weight="600" fill="#6D28D9" text-anchor="middle">Focus</text>
  <rect x="88" y="18" width="56" height="22" rx="99" fill="none" stroke="#E4E4E8" stroke-width="1"/>
  <text x="116" y="33" font-size="10" fill="#9CA3AF" text-anchor="middle">Break</text>
  <rect x="148" y="18" width="46" height="22" rx="99" fill="none" stroke="#E4E4E8" stroke-width="1"/>
  <text x="171" y="33" font-size="10" fill="#9CA3AF" text-anchor="middle">Long</text>
  <!-- Ring -->
  <circle cx="55" cy="68" r="22" fill="none" stroke="#E4E4E8" stroke-width="3"/>
  <circle cx="55" cy="68" r="22" fill="none" stroke="#8B5CF6" stroke-width="3"
    stroke-dasharray="83 55" stroke-linecap="round" transform="rotate(-90 55 68)"
    style="filter:drop-shadow(0 0 3px rgba(139,92,246,.5))"/>
  <text x="55" y="72" font-size="11" font-weight="700" fill="#8B5CF6" text-anchor="middle">24:32</text>
  <!-- Controls -->
  <rect x="88" y="57" width="28" height="24" rx="6" fill="white" stroke="#E4E4E8" stroke-width="1"/>
  <text x="102" y="73" font-size="12" fill="#9CA3AF" text-anchor="middle">↺</text>
  <rect x="120" y="57" width="58" height="24" rx="6" fill="#111827"/>
  <text x="149" y="73" font-size="12" font-weight="600" fill="white" text-anchor="middle">Start</text>
  <rect x="182" y="57" width="28" height="24" rx="6" fill="white" stroke="#E4E4E8" stroke-width="1"/>
  <text x="196" y="73" font-size="11" fill="#9CA3AF" text-anchor="middle">⏭</text>
  <!-- Pomodoro dots -->
  <text x="90" y="88" font-size="9" fill="#E5E7EB">🍅🍅🍅</text>
  <text x="122" y="88" font-size="9" fill="#22C55E">🍅</text>

  <!-- Sidebar: In this room -->
  <text x="28" y="114" font-size="9" font-weight="600" fill="#D1D5DB" letter-spacing="1.5">IN THIS ROOM</text>
  <!-- Users -->
  <circle cx="32" cy="127" r="3.5" fill="#22C55E" style="filter:drop-shadow(0 0 3px #22C55E)"/>
  <text x="42" y="131" font-size="13" fill="#16131F">Lavinia H.</text>
  <text x="170" y="131" font-size="11" fill="#9CA3AF">(you)</text>
  <circle cx="32" cy="147" r="3.5" fill="#22C55E" style="filter:drop-shadow(0 0 3px #22C55E)"/>
  <text x="42" y="151" font-size="13" fill="#4A4469">Maria G.</text>
  <circle cx="32" cy="167" r="3.5" fill="#22C55E" style="filter:drop-shadow(0 0 3px #22C55E)"/>
  <text x="42" y="171" font-size="13" fill="#4A4469">James T.</text>
  <circle cx="32" cy="187" r="3.5" fill="#22C55E" style="filter:drop-shadow(0 0 3px #22C55E)"/>
  <text x="42" y="191" font-size="13" fill="#4A4469">Sofia R.</text>

  <!-- Divider -->
  <line x1="24" y1="202" x2="244" y2="202" stroke="#E4E4E8" stroke-width="1"/>

  <!-- Sidebar: Topics -->
  <text x="28" y="220" font-size="9" font-weight="600" fill="#D1D5DB" letter-spacing="1.5">TOPICS</text>
  <!-- Active topic -->
  <rect x="24" y="226" width="220" height="28" rx="6" fill="#EDE9FE"/>
  <circle cx="36" cy="240" r="3" fill="#7C3AED"/>
  <text x="46" y="244" font-size="13" fill="#6D28D9" font-weight="600">Cell Biology</text>
  <!-- Other topics -->
  <circle cx="32" cy="266" r="2.5" fill="#8B5CF6" opacity="0.6"/>
  <text x="42" y="270" font-size="13" fill="#4A4469">Genetics</text>
  <circle cx="32" cy="286" r="2.5" fill="#8B5CF6" opacity="0.6"/>
  <text x="42" y="290" font-size="13" fill="#4A4469">Molecular Biology</text>
  <circle cx="32" cy="306" r="2.5" fill="#8B5CF6" opacity="0.6"/>
  <text x="42" y="310" font-size="13" fill="#4A4469">Ecology</text>
  <circle cx="32" cy="326" r="2.5" fill="#8B5CF6" opacity="0.6"/>
  <text x="42" y="330" font-size="13" fill="#4A4469">Evolution</text>
  <circle cx="32" cy="346" r="2.5" fill="#8B5CF6" opacity="0.6"/>
  <text x="42" y="350" font-size="13" fill="#4A4469">Human Physiology</text>

  <!-- ── Right panel (chat) ── -->
  <rect x="252" y="8" width="940" height="684" rx="24" fill="white" stroke="#E4E4E8" stroke-width="1"/>

  <!-- Tab bar -->
  <rect x="253" y="9" width="938" height="44" rx="23" fill="white"/>
  <rect x="252" y="52" width="940" height="1" fill="#E4E4E8"/>
  <!-- AI Tutor tab (active) -->
  <text x="290" y="36" font-size="13" font-weight="600" fill="#111827">AI Tutor</text>
  <rect x="283" y="49" width="64" height="2" rx="1" fill="#111827"/>
  <!-- Other tabs -->
  <text x="384" y="36" font-size="13" fill="#6B7280">Group Chat</text>
  <text x="484" y="36" font-size="13" fill="#6B7280">Messages</text>
  <text x="572" y="36" font-size="13" fill="#6B7280">Library</text>
  <text x="640" y="36" font-size="13" fill="#6B7280">Ebooks</text>

  <!-- Sustain banner -->
  <rect x="252" y="53" width="940" height="34" fill="#F0FDF4"/>
  <rect x="252" y="86" width="940" height="1" fill="#DCFCE7"/>
  <text x="276" y="74" font-size="12" fill="#374151">🌱  Every saved response is an AI query someone else doesn't need to make.</text>

  <!-- Topic focus badge -->
  <rect x="252" y="87" width="940" height="28" fill="#EDE9FE"/>
  <rect x="252" y="114" width="940" height="1" fill="#DDD6FE"/>
  <circle cx="272" cy="101" r="4" fill="#7C3AED"/>
  <text x="282" y="105" font-size="12" fill="#5B21B6">Now focused on: <tspan font-weight="700">Cell Biology</tspan></text>

  <!-- ── Messages ── -->

  <!-- AI greeting -->
  <rect x="268" y="124" width="28" height="28" rx="8" fill="#7C3AED"/>
  <text x="282" y="142" font-size="9" font-weight="800" fill="white" text-anchor="middle">AI</text>
  <rect x="304" y="122" width="430" height="58" rx="4" rx2="14" fill="#EDEDEF" stroke="#E4E4E8" stroke-width="1"
    style="border-radius:4px 14px 14px 14px"/>
  <!-- Manually clip corners with path for markdown bubble -->
  <path d="M318 122 h402 a14 14 0 0 1 14 14 v30 a14 14 0 0 1-14 14 H318 a14 14 0 0 1-14-14 v-30 a14 14 0 0 1 14-14 Z" fill="#EDEDEF" stroke="#E4E4E8" stroke-width="1"/>
  <text x="320" y="144" font-size="13" fill="#4A4469">Hi! I'm your AI tutor for <tspan font-weight="700">Biology HL</tspan>. Ask me anything</text>
  <text x="320" y="162" font-size="13" fill="#4A4469">— concepts, past papers, IA help, or exam tips.</text>

  <!-- User message -->
  <path d="M696 200 h330 a14 14 0 0 1 14 14 v38 a14 14 0 0 1-14 14 H710 a14 14 0 0 1-14-14 v-38 a4 4 0 0 1 0-14 Z" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="710" y="222" font-size="13" fill="#16131F">Can you explain the fluid mosaic model</text>
  <text x="710" y="240" font-size="13" fill="#16131F">of the cell membrane?</text>

  <!-- AI response -->
  <rect x="268" y="264" width="28" height="28" rx="8" fill="#7C3AED"/>
  <text x="282" y="282" font-size="9" font-weight="800" fill="white" text-anchor="middle">AI</text>
  <path d="M318 262 h546 a14 14 0 0 1 14 14 v238 a14 14 0 0 1-14 14 H318 a14 14 0 0 1-14-14 v-238 a14 14 0 0 1 14-14 Z" fill="#EDEDEF" stroke="#E4E4E8" stroke-width="1"/>

  <!-- AI response content -->
  <text x="320" y="286" font-size="14" font-weight="700" fill="#16131F">The Fluid Mosaic Model</text>
  <text x="320" y="306" font-size="13" fill="#4A4469">The fluid mosaic model (Singer &amp; Nicolson, 1972) describes the cell</text>
  <text x="320" y="323" font-size="13" fill="#4A4469">membrane as a dynamic, flexible bilayer. Key components:</text>

  <!-- Bullet list -->
  <circle cx="328" cy="342" r="2.5" fill="#4A4469"/>
  <text x="338" y="346" font-size="13" fill="#4A4469"><tspan font-weight="600">Phospholipid bilayer</tspan> — amphipathic molecules with hydrophilic</text>
  <text x="338" y="362" font-size="13" fill="#4A4469">heads facing outward and hydrophobic tails inward.</text>

  <circle cx="328" cy="381" r="2.5" fill="#4A4469"/>
  <text x="338" y="385" font-size="13" fill="#4A4469"><tspan font-weight="600">Membrane proteins</tspan> — integral (span the bilayer) and peripheral</text>
  <text x="338" y="401" font-size="13" fill="#4A4469">(attached to surface). Function as channels, receptors, enzymes.</text>

  <circle cx="328" cy="420" r="2.5" fill="#4A4469"/>
  <text x="338" y="424" font-size="13" fill="#4A4469"><tspan font-weight="600">Cholesterol</tspan> — stabilises fluidity across temperature ranges.</text>

  <!-- HR -->
  <line x1="320" y1="440" x2="858" y2="440" stroke="#E4E4E8" stroke-width="1"/>

  <!-- IB tip -->
  <text x="320" y="460" font-size="12" fill="#8580A8">💡 IB Tip: Paper 2 may ask you to annotate a diagram. Use the terms</text>
  <text x="320" y="476" font-size="12" fill="#8580A8">"amphipathic", "fluid", and "selective permeability" for full marks.</text>

  <!-- Inline code example -->
  <rect x="320" y="488" width="230" height="22" rx="4" fill="rgba(139,92,246,0.08)"/>
  <text x="328" y="503" font-size="12" fill="#6D28D9" font-family="monospace">glycoprotein / glycolipid</text>

  <!-- Save / Share actions (visible on hover — show inline) -->
  <text x="304" y="520" font-size="11" fill="#9CA3AF">🔖 Save</text>
  <text x="354" y="520" font-size="11" fill="#9CA3AF">· Share</text>

  <!-- ── Input row ── -->
  <rect x="252" y="646" width="940" height="1" fill="#E4E4E8"/>
  <!-- Attach button -->
  <rect x="264" y="658" width="38" height="38" rx="12" fill="white" stroke="#E4E4E8" stroke-width="1"/>
  <text x="283" y="681" font-size="16" fill="#9CA3AF" text-anchor="middle">📎</text>
  <!-- Input field -->
  <rect x="310" y="658" width="794" height="38" rx="12" fill="white" stroke="#E4E4E8" stroke-width="1"/>
  <text x="324" y="681" font-size="13" fill="#8580A8">Ask anything about Biology HL…</text>
  <!-- Send button -->
  <rect x="1112" y="658" width="38" height="38" rx="12" fill="#111827"/>
  <text x="1131" y="682" font-size="17" font-weight="700" fill="white" text-anchor="middle">↑</text>
</svg>
